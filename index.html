
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1b111b">
    <meta name="description" content="A little appreciation for one of the greatest songs of all time.">

    <title>Cowboys and Angels</title>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <main class="player">
        <div class="cover-wrapper">
            <img
                src="cover.jpg"
                alt="Cowboys and Angels album cover"
                class="cover"
            >
        </div>

        <section class="song-info">
            <h1>Cowboys and Angels</h1>
            <p class="artist">George Michael</p>
        </section>

        <audio id="song" preload="metadata">
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support audio playback :(
        </audio>

        <div class="progress-container">
            <label class="sr-only" for="progress">Song progress</label>
            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Song progress"
            >

            <div class="time-info">
                <span id="current">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button
                id="play"
                class="play-button"
                type="button"
                aria-label="Play song"
            >
                <span id="play-text">Play song</span>
            </button>
        </div>

        <div class="divider"></div>

        <footer class="footer">
            <p>This MIGHT be one of the greatest songs of all time.</p>
            <span class="footer-star" aria-hidden="true">✳</span>
        </footer>
    </main>
</body>
</html>
